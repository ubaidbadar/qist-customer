name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          API_URL="${{ secrets.API_URL || vars.API_URL || secrets.VITE_API_URL || vars.VITE_API_URL || 'https://qist.restora.live/api/v1' }}"
          echo "Building APK pointing to: $API_URL"
          ./gradlew assembleDebug -Pqist.apiUrl.debug="$API_URL" --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: qist-locker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: latest
          name: Latest Android APK
          body: |
            Automated build from `main` branch.
            Download `app-debug.apk` below.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
