name: Publish signed Qist Customer APK to Cloudflare R2

on:
  workflow_dispatch:
  push:
    branches:
      - customer-app
    tags:
      - 'customer-v*'

permissions:
  contents: write

concurrency:
  group: qist-customer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      AWS_DEFAULT_REGION: auto
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate required secrets
        shell: bash
        run: |
          for key in R2_ACCOUNT_ID R2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing GitHub Actions secret for $key"; exit 1; fi
          done

      - name: Restore signing key
        shell: bash
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qist-release.jks"

      - name: Build signed release
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :customer:assembleRelease \
            -Pqist.signing.storeFile="$RUNNER_TEMP/qist-release.jks" \
            -Pqist.signing.storePassword="$KEYSTORE_PASSWORD" \
            -Pqist.signing.keyAlias="$KEY_ALIAS" \
            -Pqist.signing.keyPassword="$KEY_PASSWORD" \
            --no-daemon
          mv customer/build/outputs/apk/release/customer-release.apk customer/build/outputs/apk/release/qist-customer-release.apk

      - name: Verify APK and publish
        shell: bash
        run: |
          set -euo pipefail
          APK="customer/build/outputs/apk/release/qist-customer-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          command -v aws
          aws s3 cp "$APK" "s3://$R2_BUCKET/android/qist-customer.apk" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=300"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Release Published to Cloudflare R2
          - **R2 Bucket**: \`$R2_BUCKET\`
          - **Object Path**: \`android/qist-customer.apk\`

          Install the signed customer APK alongside the locker app.
          EOF

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: qist-customer-release-apk
          path: customer/build/outputs/apk/release/qist-customer-release.apk
          retention-days: 30

      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/qist-release.jks"
