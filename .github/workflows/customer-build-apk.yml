name: Build Qist Customer APK

on:
  push:
    branches:
      - customer-app
    tags:
      - 'customer-v*'
  workflow_dispatch:

concurrency:
  group: qist-customer-debug-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :customer:assembleDebug --no-daemon
          mv customer/build/outputs/apk/debug/customer-debug.apk customer/build/outputs/apk/debug/qist-customer-debug.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: qist-customer-debug-apk
          path: customer/build/outputs/apk/debug/qist-customer-debug.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/customer-app'
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: customer-latest
          target_commitish: customer-app
          make_latest: false
          name: Latest Qist Customer Debug APK
          body: |
            Automated build from `customer-app` branch.
            Download `qist-customer-debug.apk` below.
          draft: false
          prerelease: false
          files: customer/build/outputs/apk/debug/qist-customer-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
