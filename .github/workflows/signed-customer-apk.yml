name: Signed Qist customer APK

# Initial run when this trusted workflow lands on main; subsequent builds can
# be started manually from GitHub Actions without committing any app changes.
on:
  push:
    branches: [main, build/customer-apk-20261118]
    paths: [.github/workflows/signed-customer-apk.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-customer-apk:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/customer-apk-20261118'
    name: Build, verify and upload signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify signing secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Build and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f customer/build/keystore/release.jks' EXIT
          chmod +x gradlew
          python3 qa/verify_lossless_assets.py
          VERSION_CODE=$(python3 -c 'import time; print(int(time.time()) - 1577836800 + 1000000)')
          ./gradlew :customer:assembleRelease :customer:lintRelease :customer:testDebugUnitTest \
            -Pqist.customer.versionCode="$VERSION_CODE" --no-daemon
          APK="customer/build/outputs/apk/release/customer-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "Signed customer release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(cut -d ' ' -f1 "$APK.sha256")" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed APK
        uses: actions/upload-artifact@v5
        with:
          name: qist-customer-signed-apk-${{ github.run_id }}
          path: |
            customer/build/outputs/apk/release/customer-release.apk
            customer/build/outputs/apk/release/customer-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
