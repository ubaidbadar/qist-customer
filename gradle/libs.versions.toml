# Every library here ships in (or tests) the device app. One line each on why it is needed.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
composeBom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
work = "2.12.0"
datastore = "1.2.1"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"
profileinstaller = "1.4.1"
firebaseMessaging = "25.0.2"
googleServices = "4.5.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
robolectric = "4.17"
composeRules = "0.6.7"

[libraries]
# Optional in-app updates and permission-free SIM number selection.
play-app-update = { module = "com.google.android.play:app-update", version = "2.1.0" }
play-auth = { module = "com.google.android.gms:play-services-auth", version = "22.0.0" }
# Hosts the Compose UI in an Activity (setContent).
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
# One version for every Compose artifact below.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# collectAsStateWithLifecycle: stops collecting while the screen is not visible.
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
# viewModel() in composables and viewModelScope.
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Periodic check-ins that survive reboots and respect Doze, without a service or wake lock.
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
# Atomic, Flow-based storage for the app's small state file (replaces SharedPreferences).
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
# HTTP client with timeouts and TLS done right.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
# JSON without reflection, so R8 can shrink it safely.
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Installs the baseline profile on devices that don't get it from Play (we are not on Play).
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
# Runs the Compose UI tests on the JVM, so `./gradlew check` needs no phone.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# ktlint rules that enforce the Compose conventions (state hoisting, modifiers, stable params).
compose-rules-ktlint = { module = "io.nlopez.compose.rules:ktlint", version.ref = "composeRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
